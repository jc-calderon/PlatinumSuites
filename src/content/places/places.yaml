# Lugares de la sección "Alrededores", confirmados por el propietario (ver docs/source/lugares.md).
#
# Campos:
#   id           identificador único (minúsculas, sin espacios)
#   name         nombre (no se traduce)
#   group        nearby = cerca (tarjetas bajo el mapa) · eat = recomendados del anfitrión
#                city = qué visitar en la ciudad · trip = escapadas
#   categories   supermarket, pharmacy, food, bakery, typical, landmark, nature, museum, market, walk
#   recommended  true = muestra el distintivo "Recomendado por el anfitrión"
#   order        plato recomendado (opcional, traducible)
#   description  texto breve traducible { es, en }
#   maps         enlace de Google Maps
#   mapsType     exact = enlace exacto · search = búsqueda provisional (sustitúyala cuando tenga el exacto)
#   coords       [latitud, longitud] (opcional, de referencia)
#
# Los pines del mapa se editan en Google My Maps, no aquí.

